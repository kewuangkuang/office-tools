<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>回单卡包</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#1f2937;background:#f8fafc}
    *{box-sizing:border-box}
    body{width:360px;margin:0;padding:16px;background:#f8fafc}
    h1{font-size:18px;margin:0 0 4px;color:#111827}
    .sub{font-size:12px;color:#64748b;line-height:1.5;margin-bottom:14px}
    .toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
    .import{display:flex;align-items:center;justify-content:center;min-width:0;padding:10px 12px;border:1px dashed #93c5fd;border-radius:10px;background:#eff6ff;color:#2563eb;text-align:center;cursor:pointer;font-size:13px}
    .import:hover{background:#dbeafe}
    .cleanup-trigger{padding:10px 10px;border:1px solid #93c5fd;background:#fff;color:#2563eb;font-size:12px}
    .cleanup-trigger:hover{background:#eff6ff}
    #packInput{display:none}
    #status{min-height:18px;margin:10px 0;font-size:12px;color:#64748b;line-height:1.5}
    .pack-list{display:grid;gap:8px}
    .empty{padding:18px 8px;text-align:center;color:#94a3b8;font-size:12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
    .pack{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
    .pack.active{border-color:#60a5fa;box-shadow:0 0 0 2px #dbeafe}
    .pack-main{min-width:0;flex:1}
    .pack-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pack-meta{font-size:11px;color:#64748b;margin-top:3px}
    button{border:0;border-radius:6px;padding:5px 8px;background:#2563eb;color:#fff;font-size:11px;cursor:pointer;white-space:nowrap}
    button.secondary{background:#eff6ff;color:#2563eb}
    button.danger{background:#fff1f2;color:#be123c}
    button:disabled{cursor:not-allowed;opacity:.5}
    .help{margin-top:14px;padding-top:10px;border-top:1px solid #e2e8f0;color:#64748b;font-size:11px;line-height:1.6}
    .modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(15,23,42,.42)}
    .modal[hidden]{display:none}
    .dialog{width:100%;max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden;border:1px solid #dbe3ef;border-radius:12px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.28)}
    .dialog-head{display:flex;align-items:flex-start;gap:8px;padding:13px 14px;border-bottom:1px solid #e5e7eb;background:#f8fafc}
    .dialog-title{min-width:0;flex:1}
    .dialog-title h2{margin:0;color:#111827;font-size:16px;line-height:1.3}
    .dialog-title p{margin:4px 0 0;color:#64748b;font-size:11px;line-height:1.5}
    .icon-button{width:28px;height:28px;padding:0;background:transparent;color:#64748b;font-size:22px;line-height:1}
    .icon-button:hover{background:#e2e8f0;color:#1e293b}
    .cleanup-summary{margin:12px 14px 0;padding:8px 9px;border-radius:8px;background:#eff6ff;color:#1d4ed8;font-size:11px;line-height:1.5}
    .cleanup-tools{display:flex;gap:8px;padding:10px 14px 0}
    .cleanup-tools .secondary{flex:1}
    .cleanup-tools .text-button{padding:5px 2px;background:transparent;color:#64748b}
    .cleanup-list{min-height:80px;max-height:290px;padding:10px 14px;overflow:auto;display:grid;gap:7px}
    .cleanup-empty{padding:20px 8px;border:1px dashed #cbd5e1;border-radius:9px;color:#94a3b8;text-align:center;font-size:12px}
    .cleanup-row{display:flex;align-items:flex-start;gap:8px;padding:9px;border:1px solid #e2e8f0;border-radius:9px;background:#fff}
    .cleanup-row.current{border-color:#93c5fd;background:#f8fbff}
    .cleanup-row input{width:15px;height:15px;margin:2px 0 0;accent-color:#2563eb}
    .cleanup-info{min-width:0;flex:1}
    .cleanup-name{display:flex;align-items:center;gap:6px;color:#1f2937;font-size:12px;font-weight:600}
    .cleanup-name span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cleanup-current{flex:none;padding:2px 5px;border-radius:4px;background:#dbeafe;color:#2563eb;font-size:10px;font-weight:500}
    .cleanup-meta{margin-top:3px;color:#64748b;font-size:10px;line-height:1.4}
    .cleanup-footer{display:flex;align-items:center;gap:8px;padding:10px 14px 13px;border-top:1px solid #e5e7eb;background:#f8fafc}
    .cleanup-selection{min-width:0;flex:1;color:#64748b;font-size:11px}
    .cleanup-footer .danger{font-size:12px}
  </style>
</head>
<body>
  <h1>📦 回单卡包</h1>
  <div class="sub">插件安装一次即可。办公工具箱导出卡包时会自动同步；这里也可以手动导入 ZIP。</div>
  <div class="toolbar">
    <label class="import" for="packInput">选择回单卡包 ZIP</label>
    <button id="cleanupButton" class="cleanup-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" title="清理旧卡包">🧹 清理</button>
  </div>
  <input id="packInput" type="file" accept=".zip,application/zip">
  <div id="status" role="status" aria-live="polite"></div>
  <div id="packList" class="pack-list"></div>
  <div class="help">卡包及回单文件只保存在本浏览器本地；插件不会上传回单内容。</div>
  <div id="cleanupModal" class="modal" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="cleanupTitle">
      <div class="dialog-head">
        <div class="dialog-title"><h2 id="cleanupTitle">🧹 清理回单卡包</h2><p>勾选不再需要的旧卡包，删除后会同时释放其中的回单文件。</p></div>
        <button id="cleanupClose" class="icon-button" type="button" aria-label="关闭清理窗口">×</button>
      </div>
      <div id="cleanupSummary" class="cleanup-summary">正在读取卡包…</div>
      <div class="cleanup-tools">
        <button id="cleanupSelectOld" class="secondary" type="button">选择全部旧卡包</button>
        <button id="cleanupClear" class="text-button" type="button">清空选择</button>
      </div>
      <div id="cleanupList" class="cleanup-list"></div>
      <div class="cleanup-footer"><span id="cleanupSelection" class="cleanup-selection">未选择卡包</span><button id="cleanupDelete" class="danger" type="button" disabled>删除选中</button></div>
    </section>
  </div>
  <script src="core.js"></script>
  <script src="zip-reader.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
